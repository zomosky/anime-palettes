[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-palettes"
version = "1.0.0"
description = "36 colour palettes derived from anime / game characters, tuned for scientific figures and slide decks"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "zomosky" }]
keywords = ["colormap", "palette", "matplotlib", "colorblind", "dataviz",
            "anime", "cielab", "colour", "scientific-visualization"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.4", "numpy>=1.20"]
build = ["matplotlib>=3.4", "numpy>=1.20", "openpyxl>=3.0"]

[project.urls]
Homepage = "https://github.com/zomosky/anime-palettes"
Documentation = "https://github.com/zomosky/anime-palettes/blob/main/docs/USAGE.md"
Issues = "https://github.com/zomosky/anime-palettes/issues"

[project.scripts]
anime-palettes = "anime_palettes:main"

[tool.setuptools]
py-modules = ["anime_palettes"]
