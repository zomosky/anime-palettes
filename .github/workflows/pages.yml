name: Pages

# 把交互色卡库发布到 GitHub Pages，别人打开网址就能用，不用 clone、不用下载。
#
# configure-pages 带了 enablement: true，会自己把 Pages 打开并设成 GitHub Actions
# 构建，所以正常情况下不需要去 Settings 里手动配。如果组织策略禁止 action 改仓库
# 设置，就手动开一次：Settings → Pages → Source 选 "GitHub Actions"。

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "docs/images/**"
      - "anime_palettes.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 组装站点
        run: |
          mkdir -p _site
          # 根 URL 直接就是色卡库本体
          cp dist/anime-palettes.html _site/index.html
          # 保留原路径，方便老链接
          mkdir -p _site/dist
          cp dist/anime-palettes.html _site/dist/
          # 数据与单文件模块：Pages 带 CORS 头，可被网页 fetch，raw.githubusercontent 不行
          cp dist/anime_palettes.json _site/anime_palettes.json
          cp dist/anime_palettes.csv  _site/anime_palettes.csv
          cp anime_palettes.py        _site/anime_palettes.py
          cp -r docs/images           _site/images
          # 让 Pages 原样发布，不要过 Jekyll（中文文件名会被吃掉）
          touch _site/.nojekyll
          ls -R _site | head -30

      # enablement: true 让 action 自己通过 API 把 Pages 打开（需要 pages: write，
      # 上面已经给了）。不加的话，仓库设置里没手动开 Pages 时这一步会直接失败：
      #   Get Pages site failed ... Error: Not Found
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
