name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest matplotlib numpy
      - name: Import without matplotlib present (核心 API 必须零依赖)
        run: |
          pip download . -d /tmp/whl --no-deps -q || true
          python -c "
          import subprocess, sys, venv, tempfile, os
          d = tempfile.mkdtemp(); venv.create(d, with_pip=True)
          py = os.path.join(d, 'bin', 'python')
          subprocess.check_call([py, '-c',
            'import sys; sys.path.insert(0, \".\"); import anime_palettes as ap;'
            'assert len(ap.colors(\"miku\"))==6; assert ap.safe(\"hutao\");'
            'print(\"zero-dependency import OK\")'])
          "
      - name: Test
        run: python -m pytest tests/ -q

      - name: 安装后 CLI 可用
        run: |
          pip install .
          anime-palettes ls --grade A
          anime-palettes show miku
          anime-palettes hex ganyu --safe
          anime-palettes code ganyu --ramp flow --lang r | head -3
          test "$(anime-palettes hex miku -n 3 | wc -l)" -eq 3

  uv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: uvx 直接跑（模拟别人从 git 拉来用）
        run: |
          uvx --from . anime-palettes ls --family 蓝
          uvx --from . anime-palettes code miku --ramp flow --lang python | head -3
      - name: PEP 723 单文件脚本
        run: |
          sed 's|git+https://github.com/zomosky/anime-palettes.git|.|' \
            examples/uv_single_file.py > /tmp/s.py
          uv run /tmp/s.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install matplotlib numpy openpyxl pytest
      - name: 重跑生成链路，确认产物与仓库一致
        run: |
          cd src
          python derive.py > /dev/null
          python gen_py.py
          python gen_html.py
          python gen_files.py
          cd ..
          diff -q src/build/anime_palettes.py anime_palettes.py
          diff -q src/build/anime-palettes.html dist/anime-palettes.html
          diff -q src/build/anime_palettes.csv dist/anime_palettes.csv
          echo "生成链路可复现"
